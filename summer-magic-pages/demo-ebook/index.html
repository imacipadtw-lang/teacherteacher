<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法書 示範電子書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE gentle fairy-tale picture book for 9-year-olds, also a script template for teachers
   IDEA a real storybook: one spread per screen, pages that lose and regain their colours
   PICTURE each page's illustration fills the top of the page; tapping Magic brings back colour
   COLOUR blush and cream paper, butter, mint, lilac, coral; SDG colours only on the chips
   TYPE Fredoka for English story text, Noto Sans TC for Chinese
   LAYOUT tabs (book / script) over a centred book; picture over text; phone keeps the same order */
:root{color-scheme:light dark;--bg:light-dark(#fff6f3,#1e1519);--paper:light-dark(#fffdfb,#2a1f24);--ink:light-dark(#3d2c35,#fbeef2);--mut:light-dark(#7a6470,#c9b3bd);--line:light-dark(#f1dbe0,#47323c);--acc:light-dark(#b5476a,#f3a6bd);--rose:#f8cfd3;--sun:#ffd36e;--mint:#7cc9b3;--lil:#b8a2e0;--co:#f29e8e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.top{max-width:1000px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{font:700 clamp(28px,4vw,40px)/1.1 Fredoka,"Noto Sans TC",sans-serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);margin:4px 0 0;font-size:15px}
.tabs{display:flex;gap:8px}
.tab,.btn{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:8px 18px;border-radius:99px;border:2px solid var(--acc);background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-pressed=true],.btn.solid{background:var(--acc);color:var(--paper)}
.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:8px 16px 40px}
.book{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:16px;padding:6px 2px 14px;scrollbar-width:none}
.book::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;background:var(--paper);border-radius:24px;border:1px solid var(--line);box-shadow:0 10px 0 -4px var(--rose);overflow:hidden;display:grid;grid-template-rows:auto auto}
.pic{position:relative;aspect-ratio:16/9;background:#fdf1ea}
.pic svg{position:absolute;inset:0;width:100%;height:100%;transition:filter 1.2s ease}
.page.gray .pic svg{filter:grayscale(1) brightness(1.05) contrast(.9)}
.pic .no{position:absolute;left:14px;top:12px;background:var(--paper);color:var(--ink);font:600 14px Fredoka,sans-serif;padding:2px 12px;border-radius:99px}
.txt{padding:18px 22px 20px;display:grid;gap:8px}
.en{font:600 clamp(22px,3.2vw,30px)/1.3 Fredoka,sans-serif;margin:0}
.zh{color:var(--mut);margin:0;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px;fill:currentColor}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button[aria-current=true]{background:var(--acc);width:26px;border-radius:6px}
.note{color:var(--mut);font-size:14px;text-align:center;margin:14px 0 0}
#script{display:none}
.scroll{overflow-x:auto;background:var(--paper);border-radius:18px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:color-mix(in srgb,var(--rose) 45%,var(--paper));font-size:14px;white-space:nowrap}
td.e{font-family:Fredoka,sans-serif;font-size:16px;min-width:200px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:16px}
.tips div{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tips h3{margin:0 0 6px;font-size:17px}
.tips p{margin:0;color:var(--mut);font-size:15px}
.spark{position:absolute;inset:0;pointer-events:none}
.spark i{position:absolute;width:10px;height:10px;background:var(--sun);border-radius:2px;transform:rotate(45deg);animation:pop .9s ease-out forwards}
@keyframes pop{from{opacity:1;transform:rotate(45deg) scale(.4)}to{opacity:0;transform:rotate(45deg) scale(1.6) translateY(-30px)}}
@media(prefers-reduced-motion:reduce){.pic svg{transition:none}.spark i{animation:none;opacity:0}.book{scroll-behavior:auto}}
@media(max-width:600px){.txt{padding:14px 16px 16px}table{font-size:14px}th,td{padding:8px}}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>The Magic Pages of Tucheng</h1>
    <p class="sub">土城的魔法書・示範電子書（教師參考用）</p>
  </div>
  <div class="tabs" role="group" aria-label="切換">
    <button class="tab" id="t-book" aria-pressed="true">電子書</button>
    <button class="tab" id="t-script" aria-pressed="false">腳本</button>
  </div>
</div>

<main class="wrap">
  <section id="bookview">
    <div class="book" id="book" tabindex="0" aria-label="電子書頁面"></div>
    <div class="nav">
      <button class="btn" id="prev">上一頁</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next">下一頁</button>
    </div>
    <p class="note">灰色的頁面按「Magic!」就會恢復顏色。按「聽朗讀」可以聽每一頁的英文。</p>
  </section>

  <section id="script">
    <div class="scroll"><table>
      <thead><tr><th>頁</th><th>英文</th><th>中文</th><th>畫面說明</th><th>SDGs</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="tips">
      <div><h3>故事結構</h3><p>開頭找到魔法書，中間每頁解決一個小問題、找回一種顏色，結尾大家一起合作。學生可以換成自己的角色和地點。</p></div>
      <div><h3>英文句子</h3><p>每頁 1 到 2 句短句，用學生學過的句型，例如 We ___. / I ___. 方便朗讀和錄音。</p></div>
      <div><h3>插圖</h3><p>先畫灰色版本，再畫彩色版本，就能做出「找回顏色」的效果。</p></div>
      <div><h3>SDGs 對應</h3><p>故事寫完再對應，一頁可以對應好幾個目標，不用湊齊 17 項。</p></div>
    </div>
  </section>
</main>

<script>
{
const SDG={2:['#DDA63A','2 消除飢餓'],3:['#4C9F38','3 健康與福祉'],6:['#26BDE2','6 淨水及衛生'],7:['#FCC30B','7 潔淨能源'],10:['#DD1367','10 減少不平等'],11:['#FD9D24','11 永續城鄉'],12:['#BF8B2E','12 責任消費及生產'],13:['#3F7E44','13 氣候行動'],14:['#0A97D9','14 保育海洋生態'],15:['#56C02B','15 保育陸域生態'],17:['#19486A','17 多元夥伴關係']};
const P=[
 {en:'The Magic Pages of Tucheng',zh:'土城的魔法書',d:'封面：一本發光的魔法書，四周有星星。',s:[],g:0,sc:'cover'},
 {en:'Mia and Leo find an old book in the library.',zh:'Mia 和 Leo 在圖書館找到一本舊書。',d:'圖書館書架，兩個孩子發現一本發光的書。',s:[],g:0,sc:'library'},
 {en:'The book opens. "Help! My pages lost their colors!"',zh:'書打開了：「救命啊！我的頁面失去了顏色！」',d:'打開的書，頁面是灰色的，書在求救。',s:[],g:0,sc:'help'},
 {en:'The river is gray and dirty. We pick up the trash. The river is blue again!',zh:'河水又灰又髒。我們把垃圾撿起來，河水又變藍了！',d:'河邊撿垃圾，河水從灰色變回藍色。',s:[6,14],g:1,sc:'river'},
 {en:'The lights are on, but no one is home. Click! We turn off the lights.',zh:'燈開著，可是沒有人在家。喀！我們把燈關掉。',d:'房子的窗戶亮著燈，孩子按下開關。',s:[7],g:1,sc:'lights'},

const star=(x,y,r,c)=>`<path d="M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}Z" fill="${c||'#ffd36e'}"/>`;
const ground=(c)=>`<rect x="0" y="200" width="400" height="60" fill="${c||'#bfe3b4'}"/><ellipse cx="80" cy="205" rx="140" ry="22" fill="#a8d89c"/>`;

const openBook=(x,y,w,fill1,fill2)=>`<g transform="translate(${x} ${y})"><path d="M0 8Q${-w*.25} -6 ${-w*.5} 6V${w*.36}Q${-w*.25} ${w*.26} 0 ${w*.4}Z" fill="${fill1}" stroke="#e7a3ad" stroke-width="3"/><path d="M0 8Q${w*.25} -6 ${w*.5} 6V${w*.36}Q${w*.25} ${w*.26} 0 ${w*.4}Z" fill="${fill2}" stroke="#e7a3ad" stroke-width="3"/></g>`;
const S={

 together:()=>`<rect width="400" height="225" fill="#fdf1ea"/>${['#E5243B','#FD9D24','#FCC30B','#56C02B','#26BDE2','#00689D','#b8a2e0'].map((c,i)=>`<path d="M60 150A140 140 0 0 1 340 150" stroke="${c}" stroke-width="10" fill="none" transform="translate(0 ${i*10}) scale(1 ${1-i*.03})" opacity=".9"/>`).join('')}${openBook(200,140,140,'#fffdfb','#fff4f0')}${mia(90,140,'up')}${leo(310,140,'up')}${kid(150,150,'#b8a2e0','#8a6a55',0,'up')}${kid(250,150,'#ffd36e','#3d2c35',1,'up')}${[[60,40],[340,40],[200,20]].map(s=>star(...s,8)).join('')}`,
 end:()=>`<rect width="400" height="225" fill="#f8cfd3"/><circle cx="200" cy="105" r="70" fill="#ffd36e"/><circle cx="200" cy="105" r="56" fill="#fff4c7"/>${star(200,92,22,'#f29e8e')}<text x="200" y="140" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="15" font-weight="700" fill="#b5476a">Magic Page Makers</text><path d="M160 172l-14 40 22-10 10 18 14-46zM240 172l14 40-22-10-10 18-14-46z" fill="#b5476a"/>${[[50,40],[350,60],[70,190],[340,190]].map(s=>star(...s,7)).join('')}`
};
const spk='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8a5 5 0 0 1 0 8l-1.4-1.4a3 3 0 0 0 0-5.2zM18.5 5.5a8.5 8.5 0 0 1 0 13l-1.4-1.4a6.5 6.5 0 0 0 0-10.2z"/></svg>';
const book=document.getElementById('book');
book.innerHTML=P.map((p,i)=>`<article class="page${p.g?' gray':''}" id="pg${i}" aria-label="第 ${i} 頁"><div class="pic"><svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${p.d}">${S[p.sc]()}</svg><span class="no">${i?'Page '+i:'Cover'}</span><div class="spark"></div></div><div class="txt"><p class="en">${p.en}</p><p class="zh">${p.zh}</p><div class="row"><div class="chips">${p.s.map(n=>`<span class="chip" style="background:${SDG[n][0]}">${SDG[n][1]}</span>`).join('')}</div><div class="acts"><button class="btn" data-say="${i}">${spk}聽朗讀</button>${p.g?`<button class="btn solid" data-magic="${i}">Magic!</button>`:''}</div></div></div></article>`).join('');
const dots=document.getElementById('dots');
dots.innerHTML=P.map((_,i)=>`<button aria-label="到第 ${i} 頁" data-go="${i}"></button>`).join('');
let cur=0,audio=null;
const go=i=>{i=Math.max(0,Math.min(P.length-1,i));document.getElementById('pg'+i).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest',inline:'center'})};
const mark=()=>{dots.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===cur))};
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){cur=+e.target.id.slice(2);mark()}})},{root:book,threshold:[.6]});
book.querySelectorAll('.page').forEach(p=>io.observe(p));mark();
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
dots.onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)};
book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}});
book.addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');
 if(s){try{if(audio)audio.pause();audio=new Audio('audio/p'+String(s.dataset.say).padStart(2,'0')+'.mp3');audio.play().catch(()=>{})}catch(err){}}
 const m=e.target.closest('[data-magic]');
 if(m){const pg=document.getElementById('pg'+m.dataset.magic);const on=pg.classList.toggle('gray');m.textContent=on?'Magic!':'變回灰色';
  if(!on){const sp=pg.querySelector('.spark');sp.innerHTML=Array.from({length:14},(_,k)=>`<i style="left:${8+((k*37)%84)}%;top:${15+((k*53)%70)}%;animation-delay:${k*40}ms"></i>`).join('');setTimeout(()=>sp.innerHTML='',1400)}}
});
document.getElementById('rows').innerHTML=P.map((p,i)=>`<tr><td>${i?i:'封面'}</td><td class="e">${p.en}</td><td>${p.zh}</td><td>${p.d}</td><td>${p.s.map(n=>`<span class="chip" style="background:${SDG[n][0]}">${SDG[n][1]}</span>`).join(' ')||'—'}</td></tr>`).join('');
const tb=document.getElementById('t-book'),ts=document.getElementById('t-script');
const view=v=>{document.getElementById('bookview').style.display=v==='book'?'':'none';document.getElementById('script').style.display=v==='script'?'block':'none';tb.setAttribute('aria-pressed',v==='book');ts.setAttribute('aria-pressed',v==='script')};
const rh=x=>{try{history.replaceState(null,'',x)}catch(e){}};tb.onclick=()=>{view('book');rh('#book')};ts.onclick=()=>{view('script');rh('#script')};
view(location.hash==='#script'?'script':'book');
}
</script>
</body>
</html>
