<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#fff1c9}svg{display:block}</style>
</head><body>
<svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const S=document.getElementById('s');
const C={bg:'#fff1c9',apr:'#f4a259',ter:'#c8553d',ink:'#3b2a20',cream:'#fffaee',mint:'#7cc9b3',sun:'#ffd36e',coral:'#f29e8e',lil:'#b8a2e0',sky:'#9fd3e8'};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const star=(r,c)=>`<path d="M0 ${-r}L${r*.28} ${-r*.28}L${r} 0L${r*.28} ${r*.28}L0 ${r}L${-r*.28} ${r*.28}L${-r} 0L${-r*.28} ${-r*.28}Z" fill="${c}"/>`;
const kid=(sh,hair,girl,wave)=>`<ellipse cx="0" cy="118" rx="44" ry="10" fill="#000" opacity=".12"/><rect x="-30" y="34" width="60" height="70" rx="26" fill="${sh}"/><rect x="-22" y="92" width="17" height="28" rx="8" fill="#5a4636"/><rect x="5" y="92" width="17" height="28" rx="8" fill="#5a4636"/><g transform="rotate(${wave} 26 46)"><rect x="22" y="-8" width="15" height="54" rx="7.5" fill="${sh}"/><circle cx="29.5" cy="-10" r="10" fill="#f6d2b8"/></g><circle cx="0" cy="6" r="32" fill="#f6d2b8"/><path d="M-32 2a32 32 0 0 1 64 0c-12-13-52-13-64 0z" fill="${hair}"/>${girl?`<circle cx="-33" cy="10" r="11" fill="${hair}"/><circle cx="33" cy="10" r="11" fill="${hair}"/>`:''}<circle cx="-10" cy="8" r="4" fill="${C.ink}"/><circle cx="10" cy="8" r="4" fill="${C.ink}"/><path d="M-9 20q9 8 18 0" stroke="${C.ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="-19" cy="18" r="5" fill="${C.coral}" opacity=".7"/><circle cx="19" cy="18" r="5" fill="${C.coral}" opacity=".7"/>`;
const chips=[['寫英文故事',C.coral,'pen'],['畫繪本插畫',C.sun,'brush'],['寫程式做遊戲',C.mint,'code'],['會說話的電子書',C.lil,'sound']];
const icon=(k)=>({
 pen:`<path d="M-12 12l4-12 14-14 8 8-14 14z" fill="#fff"/><path d="M-12 12l4-12 8 8z" fill="${C.ink}"/>`,
 brush:`<circle cx="-4" cy="-4" r="11" fill="#fff"/><circle cx="-8" cy="-8" r="3" fill="${C.ter}"/><circle cx="1" cy="-9" r="3" fill="${C.mint}"/><circle cx="3" cy="0" r="3" fill="${C.lil}"/><rect x="2" y="4" width="14" height="5" rx="2" transform="rotate(40 2 4)" fill="${C.ink}"/>`,
 code:`<path d="M-6 -10l-10 10 10 10M6 -10l10 10-10 10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
 sound:`<path d="M-14 -6h7l9-8v28l-9-8h-7z" fill="#fff"/><path d="M8 -8a11 11 0 0 1 0 16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`
}[k]);
const title='Magic Pages';
let W=null;const measure=()=>{const c=document.createElement('canvas').getContext('2d');c.font='700 140px Fredoka';const ws=[...title].map(ch=>c.measureText(ch).width+(ch===' '?10:2));const tot=ws.reduce((a,b)=>a+b,0);let x=540-tot/2;W=ws.map(w=>{const cx=x+w/2;x+=w;return cx})};
window.draw=function(t){
 const T=12, loop=t%T;
 let o=`<rect width="1080" height="1350" fill="${C.bg}"/>`;
 // top apricot band
 o+=`<path d="M0 0H1080V${430+Math.sin(t*1.2)*8}Q540 ${490+Math.sin(t*1.2+1)*10} 0 ${430+Math.sin(t*1.2+2)*8}Z" fill="${C.apr}"/>`;
 // tag pill
 const tg=eo(t/0.6);
 o+=`<g transform="translate(540 ${70-30*(1-tg)})" opacity="${tg}"><rect x="-260" y="-30" width="520" height="60" rx="30" fill="${C.cream}"/><text x="0" y="12" text-anchor="middle" font-family="Noto Sans TC" font-weight="700" font-size="30" fill="${C.ter}">116 年夏日樂學・土城國小英語營隊</text></g>`;
 // title letters drop
 if(!W)measure();
 [...title].forEach((ch,i)=>{const p=back((t-0.4-i*0.07)/0.5);const bob=Math.sin(t*3+i*.6)*(t>2?5:0);
  o+=`<text x="${W[i]}" y="${235-(1-p)*240+bob}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="140" fill="${C.ink}" opacity="${cl(p*2)}">${ch===' '?'':ch}</text>`});
 const zh=back((t-1.3)/0.6);
 o+=`<text x="540" y="345" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="92" fill="${C.cream}" stroke="${C.ter}" stroke-width="10" paint-order="stroke" transform="translate(540 315) scale(${zh}) translate(-540 -315)">土城魔法書城</text>`;
 const hk=eo((t-1.9)/0.6);
 o+=`<text x="540" y="${420+20*(1-hk)}" text-anchor="middle" font-family="Noto Sans TC" font-weight="700" font-size="42" fill="${C.ink}" opacity="${hk}">這個夏天，寫出你的第一本英文魔法書！</text>`;
 // scene: rainbow
 const rb=eo((t-0.8)/1.2);
 ['#e5534b','#f4a259','#ffd36e','#7cc9b3','#9fd3e8','#b8a2e0'].forEach((c,i)=>{const r=330-i*24;const len=Math.PI*r;o+=`<path d="M${540-r} 860A${r} ${r} 0 0 1 ${540+r} 860" stroke="${c}" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len*(1-rb)}" opacity=".9"/>`});
 // book
 const by=780+Math.sin(t*2)*10, bs=back((t-0.2)/0.7);
 o+=`<g transform="translate(540 ${by}) scale(${bs})"><ellipse cx="0" cy="${120-Math.sin(t*2)*10}" rx="230" ry="18" fill="#000" opacity=".1"/>
 <path d="M0 -60Q-110 -110 -240 -70V90Q-110 50 0 100Z" fill="${C.ter}"/><path d="M0 -60Q110 -110 240 -70V90Q110 50 0 100Z" fill="${C.ter}"/>
 <path d="M0 -70Q-105 -118 -225 -82V76Q-105 38 0 86Z" fill="${C.cream}"/><path d="M0 -70Q105 -118 225 -82V76Q105 38 0 86Z" fill="#fff"/>
 ${[0,1,2,3].map(k=>`<rect x="-195" y="${-55+k*30}" width="${140-k*18}" height="9" rx="4.5" fill="#f3d7b5"/>`).join('')}
 <circle cx="120" cy="-30" r="30" fill="${C.sun}"/><path d="M50 50L100 -5L135 30L160 5L210 50Z" fill="${C.mint}"/>
 ${[0,1].map(k=>{const ph=((t*0.9+k*0.5)%1);const sx=Math.cos(ph*Math.PI);return `<path d="M0 -70Q${105*sx} -118 ${225*sx} -82V76Q${105*sx} 38 0 86Z" fill="#fff" opacity="${.55+.4*Math.abs(sx)}" stroke="#f3d7b5" stroke-width="2"/>`}).join('')}
 <rect x="-4" y="84" width="8" height="${40+Math.sin(t*4)*6}" rx="3" fill="${C.sun}"/></g>`;
 // flying letters and icons out of book
 const fly=['A','B','C','♥','★','a','b','c'];
 fly.forEach((ch,i)=>{const ph=((t*0.35+i/fly.length)%1);if(t<1.2)return;const ang=-Math.PI/2+(i-3.5)*0.32;const d=60+ph*360;const x=540+Math.cos(ang)*d*1.25,y=by-40+Math.sin(ang)*d*0.95;const op=Math.sin(ph*Math.PI);const col=[C.ter,C.mint,'#e5534b',C.coral,C.sun,C.lil,C.ter,C.mint][i];
  o+=ch==='★'?`<g transform="translate(${x} ${y}) rotate(${t*120})" opacity="${op}">${star(26,col)}</g>`:ch==='♥'?`<g transform="translate(${x} ${y}) scale(${.8+.3*Math.sin(t*6)})" opacity="${op}"><path d="M0 18L-20 -2a12 12 0 0 1 20-14a12 12 0 0 1 20 14z" fill="${col}"/></g>`:`<text x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="${52+10*Math.sin(ph*Math.PI)}" fill="${col}" opacity="${op}" transform="rotate(${Math.sin(t*2+i)*15} ${x} ${y})">${ch}</text>`});
 // kids
 const k1=eo((t-0.9)/0.6),k2=eo((t-1.1)/0.6);
 o+=`<g transform="translate(${170-200*(1-k1)} ${760-Math.abs(Math.sin(t*3.2))*30}) scale(1.15)">${kid(C.coral,'#6b4a3a',1,-20+Math.sin(t*6)*25)}</g>`;
 o+=`<g transform="translate(${910+200*(1-k2)} ${760-Math.abs(Math.sin(t*3.2+1.5))*30}) scale(-1.15 1.15)">${kid(C.mint,C.ink,0,-20+Math.sin(t*6+1)*25)}</g>`;
 // twinkle stars
 [[90,520,18],[990,540,22],[70,930,14],[1010,950,16],[300,480,12],[780,470,14]].forEach(([x,y,r],i)=>{const s=.6+.5*Math.abs(Math.sin(t*2.4+i));o+=`<g transform="translate(${x} ${y}) scale(${s}) rotate(${t*40+i*20})">${star(r,i%2?C.sun:'#fff')}</g>`});
 // chips
 chips.forEach((c,i)=>{const p=back((t-2.6-i*0.35)/0.55);const cx=i%2?790:290,cy=1000+Math.floor(i/2)*100;const bob=Math.sin(t*2.5+i)*4;
  o+=`<g transform="translate(${cx} ${cy+bob}) scale(${cl(p,0,1.2)})" opacity="${cl(p*2)}"><rect x="-230" y="-40" width="460" height="80" rx="40" fill="${C.cream}" stroke="${c[1]}" stroke-width="5"/><circle cx="-185" cy="0" r="28" fill="${c[1]}"/><g transform="translate(-185 0) rotate(${Math.sin(t*4+i)*10})">${icon(c[2])}</g><text x="25" y="13" text-anchor="middle" font-family="Noto Sans TC" font-weight="700" font-size="36" fill="${C.ink}">${c[0]}</text></g>`});
 // bottom band
 const bb=eo((t-3.8)/0.7);
 o+=`<g transform="translate(0 ${220*(1-bb)})"><path d="M0 1200Q540 ${1160+Math.sin(t*1.5)*12} 1080 1200V1350H0Z" fill="${C.ter}"/>
 <text x="540" y="1262" text-anchor="middle" font-family="Noto Sans TC" font-weight="700" font-size="36" fill="${C.cream}">7 月・15 天下午課程・招收 20 位小作家</text>
 <text x="540" y="1316" text-anchor="middle" font-family="Noto Sans TC" font-weight="500" font-size="28" fill="${C.cream}" opacity=".9">報名請洽 土城國小教務處</text></g>`;
 // CTA badge
 const cb=back((t-4.4)/0.6), pulse=1+0.06*Math.sin(t*5);
 o+=`<g transform="translate(935 545) rotate(10) scale(${cl(cb,0,1.2)*pulse})"><circle r="92" fill="${C.sun}"/><circle r="80" fill="none" stroke="${C.ter}" stroke-width="4" stroke-dasharray="10 8" transform="rotate(${t*30})"/><text y="-8" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="30" fill="${C.ter}">快來接下</text><text y="32" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="30" fill="${C.ter}">神祕任務！</text></g>`;
 S.innerHTML=o;
};
draw(6);
</script></body></html>
